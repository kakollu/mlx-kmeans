[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-kmeans"
version = "0.1.0"
description = "Exact k-means on Apple Silicon GPUs (MLX + custom Metal kernels)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["mlx>=0.29", "numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
mlx-kmeans = "mlx_kmeans.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mlx_kmeans"]
