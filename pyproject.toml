[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-kmeans"
version = "0.1.0"
description = "Exact k-means on Apple Silicon GPUs (MLX + custom Metal kernels)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["mlx>=0.29", "numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
benchmark = ["psutil>=5.9", "pyarrow>=14", "scikit-learn>=1.3", "certifi>=2024.2.2"]
files = ["pandas>=1.5", "openpyxl>=3.1", "psutil>=5.9"]

[project.scripts]
mlx-kmeans = "mlx_kmeans.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mlx_kmeans"]
